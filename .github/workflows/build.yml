name: Build NeoForge Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Disable AccessTransformer task
        run: echo "gradle.taskGraph.whenReady { graph -> graph.allTasks.findAll { it.name == 'neoFormApplyForgesAccessTransformer' }.each { it.enabled = false } }" >> build.gradle
      - name: Clean old caches
        run: rm -rf build .gradle ~/.gradle/caches/modules-2/files-2.1/net.neoforged.neoform ~/.gradle/caches/modules-2/files-2.1/net.neoforged.neoforge
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
