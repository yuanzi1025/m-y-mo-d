name: Build NeoForge Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Clean Gradle caches and build
        run: |
          rm -rf build .gradle
          rm -rf ~/.gradle/caches
      - name: Build with Gradle (skip access transformers)
        run: ./gradlew build --no-daemon -Dorg.gradle.internal.launcher.welcomeMessageDisplayed=false
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
